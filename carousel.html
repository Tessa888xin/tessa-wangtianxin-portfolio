<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旋转木马 | 王天心 Tessa</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Smiley Sans","得意黑","Microsoft YaHei","PingFang SC",sans-serif;
  background:#fefcf8;min-height:100vh;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  perspective:1200px;
}
.back-link{
  position:fixed;top:28px;left:32px;font-size:0.95rem;font-weight:700;
  color:#3b82f6;cursor:pointer;z-index:10;
}
.back-link:hover{color:#f97316;}
.title{
  font-size:2rem;font-weight:800;margin-bottom:30px;
  background:linear-gradient(135deg,#2563eb,#f97316);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
/* 3D Carousel stage */
.carousel-stage{
  width:300px;height:220px;position:relative;
  transform-style:preserve-3d;
  animation:carouselSpin 20s linear infinite;
}
.carousel-stage:hover{animation-play-state:paused;}

.carousel-card{
  position:absolute;top:0;left:0;width:100%;height:100%;
  border-radius:16px;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,0.15);
  backface-visibility:hidden;
}
.carousel-card img{
  width:100%;height:100%;object-fit:cover;
}

/* 8 cards positioned in a 3D circle */
.carousel-card:nth-child(1){transform:rotateY(0deg) translateZ(440px);}
.carousel-card:nth-child(2){transform:rotateY(45deg) translateZ(440px);}
.carousel-card:nth-child(3){transform:rotateY(90deg) translateZ(440px);}
.carousel-card:nth-child(4){transform:rotateY(135deg) translateZ(440px);}
.carousel-card:nth-child(5){transform:rotateY(180deg) translateZ(440px);}
.carousel-card:nth-child(6){transform:rotateY(225deg) translateZ(440px);}
.carousel-card:nth-child(7){transform:rotateY(270deg) translateZ(440px);}
.carousel-card:nth-child(8){transform:rotateY(315deg) translateZ(440px);}

@keyframes carouselSpin{
  from{transform:rotateY(0deg);}
  to{transform:rotateY(360deg);}
}

@media(max-width:600px){
  .carousel-stage{width:220px;height:160px;}
  .carousel-card:nth-child(1){transform:rotateY(0deg) translateZ(320px);}
  .carousel-card:nth-child(2){transform:rotateY(45deg) translateZ(320px);}
  .carousel-card:nth-child(3){transform:rotateY(90deg) translateZ(320px);}
  .carousel-card:nth-child(4){transform:rotateY(135deg) translateZ(320px);}
  .carousel-card:nth-child(5){transform:rotateY(180deg) translateZ(320px);}
  .carousel-card:nth-child(6){transform:rotateY(225deg) translateZ(320px);}
  .carousel-card:nth-child(7){transform:rotateY(270deg) translateZ(320px);}
  .carousel-card:nth-child(8){transform:rotateY(315deg) translateZ(320px);}
}
</style>
</head>
<body>

<a href="ai.html" class="back-link">← 返回AI创造</a>

<h1 class="title">旋转木马</h1>

<div class="carousel-stage">
  <div class="carousel-card"><img src="个人照片.jpg" alt=""></div>
  <div class="carousel-card"><img src="食物照片.jpg" alt=""></div>
  <div class="carousel-card"><img src="p1.jpg" alt=""></div>
  <div class="carousel-card"><img src="p2.jpg" alt=""></div>
  <div class="carousel-card"><img src="吉酪坊1.png" alt=""></div>
  <div class="carousel-card"><img src="吉酪坊2.png" alt=""></div>
  <div class="carousel-card"><img src="吉酪坊3.jpg" alt=""></div>
  <div class="carousel-card"><img src="吉酪坊4.jpg" alt=""></div>
</div>

</body>
</html>
