<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实习详情 | 王天心 Tessa</title>
<link href="https://fonts.googleapis.com/css2?family=Smiley+Sans&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Smiley Sans","得意黑","Microsoft YaHei","PingFang SC",sans-serif;background:#fefcf8 url('背景1.png') center/cover no-repeat fixed;color:#1e293b;line-height:1.7;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:60px 24px 80px}
.bg-orbs{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(140px);opacity:0.13;animation:float 10s ease-in-out infinite}
.orb:nth-child(1){width:500px;height:500px;background:#3b82f6;top:-12%;right:-8%}
.orb:nth-child(2){width:400px;height:400px;background:#10b981;bottom:-10%;left:-10%;animation-delay:-3s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(35px,-25px) scale(1.06)}66%{transform:translate(-25px,18px) scale(0.94)}}
.back-link{position:fixed;top:28px;left:32px;font-size:0.95rem;font-weight:700;color:#3b82f6;cursor:pointer;transition:color 0.3s;z-index:10}
.back-link:hover{color:#f97316}
.container{max-width:720px;width:100%;margin-top:30px}
.hero-icon{font-size:4rem;text-align:center;margin-bottom:12px}
h1{font-size:2rem;font-weight:900;text-align:center;margin-bottom:16px;line-height:1.3}
.gradient{background:linear-gradient(135deg,#2563eb,#10b981,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.date-badge{display:inline-block;padding:8px 20px;border-radius:24px;font-size:0.85rem;font-weight:700;margin-bottom:24px;text-align:center;width:fit-content;margin-left:auto;margin-right:auto;display:block}
.company-name{text-align:center;font-size:1.1rem;font-weight:700;color:#f97316;margin-bottom:28px}
.content-block{background:#fff;border:1.5px solid rgba(0,0,0,0.05);border-radius:18px;padding:28px;margin-bottom:16px}
.content-block h3{font-size:1rem;font-weight:800;margin-bottom:10px;color:#1e293b}
.content-block ul{color:#4b5563;font-size:0.92rem}
.content-block ul li{position:relative;padding-left:16px;margin-bottom:8px}
.content-block ul li::before{content:'▸';position:absolute;left:0;color:#10b981;font-weight:700}

/* Theme variations */
.theme-blue .date-badge{background:#eff6ff;color:#2563eb}
.theme-pink .date-badge{background:#fdf2f8;color:#be185d}
.theme-green .date-badge{background:#ecfdf5;color:#065f46}
.theme-yellow .date-badge{background:#fffbeb;color:#b45309}
@media(max-width:600px){
  body{padding:40px 16px 60px}
  .container{margin-top:20px}
  h1{font-size:1.5rem}
  .content-block{padding:20px}
  .hero-icon{font-size:3rem}
}
</style>
</head>
<body>

<div class="bg-orbs"><div class="orb"></div><div class="orb"></div></div>

<a href="index.html" class="back-link" id="backLink">← 返回首页</a>

<div class="container" id="content"></div>

</body>
</html>
